services:
  triage:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 4g
    environment:
      TZ: ${TZ:-UTC}  # local day boundaries for coverage and date ranges (set in .env)
    volumes:
      - ./secrets:/app/secrets
      - ./config:/app/config:ro
      - ./data:/app/data
      - hf-cache:/root/.cache/huggingface

volumes:
  hf-cache:
